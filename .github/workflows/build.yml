name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Ezan kayıtlarını indir (freesound.org, CC BY)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/res/raw
          curl -fsSL -o app/src/main/res/raw/ezan_sabah.mp3 "https://cdn.freesound.org/previews/28/28775_5726-hq.mp3" || rm -f app/src/main/res/raw/ezan_sabah.mp3
          curl -fsSL -o app/src/main/res/raw/ezan.mp3 "https://cdn.freesound.org/previews/255/255231_4232604-hq.mp3" || rm -f app/src/main/res/raw/ezan.mp3
          ls -la app/src/main/res/raw || true

      - name: APK derle
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merkezcamii-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Sonucu build dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build-log.txt /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/MerkezCamii.apk 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q
          git config user.name "Merkez Camii"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -q -b build
          git add -A
          git commit -q -m "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
